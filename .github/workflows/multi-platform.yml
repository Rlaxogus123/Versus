name: Build Geode Mod (Windows and Android)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, membership]
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }} (${{ matrix.edition }})
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: ${{ matrix.config.target }}
          configure-args: -DVERSUS_MEMBERSHIP=${{ matrix.edition == 'membership' && 'ON' || 'OFF' }}
      - uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.config.name }}-${{ matrix.edition }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: geode-*
          path: artifacts
      - name: Combine and verify both editions
        run: python3 scripts/package_editions.py artifacts output
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: output/*.geode
          if-no-files-found: error
      - name: Publish rolling all-platform builds
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/tipp7.versus-AllPlatform-standard.geode output/tipp7.versus-AllPlatform.geode
          gh release view all-platform-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create all-platform-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Latest Windows and Android Builds" --notes "Standard and membership editions. Install only one. Windows, Android32 and Android64; no Apple binaries."
          gh release upload all-platform-latest output/*.geode --repo "$GITHUB_REPOSITORY" --clobber
